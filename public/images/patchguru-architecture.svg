<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arr-loop" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
    <linearGradient id="llm-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="570" fill="#f8fafc" rx="14"/>

  <!-- ═══════════════════════════════════
       INPUT: Pull Request
  ════════════════════════════════════ -->
  <rect x="10" y="88" width="120" height="50" rx="8" fill="white" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="70" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Pull Request</text>
  <text x="70" y="126" text-anchor="middle" font-size="11" fill="#64748b">(𝒞, 𝒟)</text>
  <line x1="130" y1="113" x2="148" y2="113" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════
       PHASE 1: Oracle Inference
  ════════════════════════════════════ -->
  <rect x="133" y="55" width="232" height="300" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- header bar -->
  <rect x="133" y="55" width="232" height="30" rx="10" fill="#3b82f6"/>
  <rect x="133" y="72" width="232" height="13" fill="#3b82f6"/>
  <text x="249" y="75" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.6">PHASE 1 · Oracle Inference</text>

  <!-- Box 1.1: Gather NL Artifacts -->
  <rect x="148" y="97" width="202" height="48" rx="7" fill="white" stroke="#93c5fd" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="249" y="118" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e40af">Gather NL Artifacts</text>
  <text x="249" y="134" text-anchor="middle" font-size="10" fill="#93c5fd">Issue Reports · Commit Messages</text>

  <!-- Arrow 1.1 → 1.2 -->
  <line x1="249" y1="145" x2="249" y2="175" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Box 1.2: Extract Function Context -->
  <rect x="148" y="175" width="202" height="48" rx="7" fill="white" stroke="#93c5fd" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="249" y="196" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e40af">Extract Function Context</text>
  <text x="249" y="212" text-anchor="middle" font-size="10" fill="#93c5fd">Patched · Buggy · Signatures</text>

  <!-- Arrow 1.2 → 1.3 -->
  <line x1="249" y1="223" x2="249" y2="253" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Box 1.3: Synthesize Patch Oracle (LLM) -->
  <rect x="148" y="253" width="202" height="48" rx="7" fill="white" stroke="#93c5fd" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="249" y="274" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e40af">Synthesize Patch Oracle</text>
  <rect x="222" y="284" width="54" height="16" rx="8" fill="url(#llm-grad)"/>
  <text x="249" y="296" text-anchor="middle" font-size="9" font-weight="700" fill="white">✦ LLM</text>

  <!-- Arrow Phase 1 → Execute (Oracle label) -->
  <polyline points="350,277 378,277 378,210 422,210" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="363" y="270" font-size="11" fill="#475569" font-style="italic">𝒪</text>

  <!-- ═══════════════════════════════════
       EXECUTE COMPARISON PROGRAM
  ════════════════════════════════════ -->
  <rect x="422" y="182" width="198" height="58" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="521" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Execute Comparison</text>
  <text x="521" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Program</text>

  <!-- Error Repair (dashed) -->
  <rect x="434" y="257" width="174" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="521" y="279" text-anchor="middle" font-size="11" fill="#94a3b8">Error Repair</text>
  <line x1="497" y1="240" x2="497" y2="257" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-loop)"/>
  <line x1="545" y1="257" x2="545" y2="240" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arr-loop)"/>

  <!-- Arrow Execute → Status diamond -->
  <line x1="620" y1="211" x2="657" y2="211" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════
       EXECUTION STATUS diamond
  ════════════════════════════════════ -->
  <polygon points="692,178 730,211 692,244 654,211" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.8"/>
  <text x="692" y="206" text-anchor="middle" font-size="10" font-weight="600" fill="#0c4a6e">Execution</text>
  <text x="692" y="220" text-anchor="middle" font-size="10" font-weight="600" fill="#0c4a6e">Status?</text>

  <!-- ═══════════════════════════════════
       VIOLATION → PHASE 3: Self-Review
  ════════════════════════════════════ -->
  <!-- Diamond top → up → right → Phase 3 LLM box top -->
  <polyline points="692,178 692,68 912,68 912,95" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="800" y="62" text-anchor="middle" font-size="10.5" font-weight="600" fill="#475569">VIOLATION</text>

  <rect x="752" y="52" width="320" height="285" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <!-- Phase 3 header bar -->
  <rect x="752" y="52" width="320" height="30" rx="10" fill="#7c3aed"/>
  <rect x="752" y="69" width="320" height="13" fill="#7c3aed"/>
  <text x="912" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.6">PHASE 3 · Self-Review</text>

  <!-- LLM Self-Review box -->
  <rect x="767" y="95" width="290" height="48" rx="7" fill="white" stroke="#c4b5fd" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="912" y="116" text-anchor="middle" font-size="12.5" font-weight="500" fill="#4c1d95">LLM-based Self-Review</text>
  <rect x="885" y="126" width="54" height="16" rx="8" fill="url(#llm-grad)"/>
  <text x="912" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="white">✦ LLM</text>

  <!-- Arrow LLM SR → True Positive diamond -->
  <line x1="912" y1="143" x2="912" y2="168" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- True Positive? diamond -->
  <polygon points="912,168 950,200 912,232 874,200" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="912" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#4c1d95">True</text>
  <text x="912" y="209" text-anchor="middle" font-size="10" font-weight="600" fill="#4c1d95">Positive?</text>

  <!-- YES → Bug Report -->
  <line x1="912" y1="232" x2="912" y2="258" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="924" y="249" font-size="10" fill="#475569">Yes</text>

  <!-- Bug Report box -->
  <rect x="767" y="258" width="290" height="48" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="912" y="287" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Bug Report</text>

  <!-- NO (enhance oracle) → loop back to Execute
       Exit Phase 3 left → go UP above all phases → enter Execute from top at x=490 -->
  <polyline points="874,200 743,200 743,42 490,42 490,182" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr-loop)"/>
  <text x="616" y="35" text-anchor="middle" font-size="9.5" fill="#94a3b8" font-style="italic">No (enhance oracle)</text>

  <!-- ═══════════════════════════════════
       NO_VIOLATION → PHASE 2
  ════════════════════════════════════ -->
  <polyline points="692,244 692,365 249,365 249,390" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="358" font-size="10.5" font-weight="600" fill="#475569">NO_VIOLATION</text>

  <!-- ═══════════════════════════════════
       PHASE 2: Oracle Enhancement
  ════════════════════════════════════ -->
  <rect x="133" y="375" width="695" height="158" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <!-- Phase 2 header bar -->
  <rect x="133" y="375" width="695" height="30" rx="10" fill="#16a34a"/>
  <rect x="133" y="392" width="695" height="13" fill="#16a34a"/>
  <text x="480" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="white" letter-spacing="0.6">PHASE 2 · Oracle Enhancement</text>

  <!-- Box 2.1: Generalize Assertions (LLM) -->
  <rect x="148" y="416" width="185" height="48" rx="7" fill="white" stroke="#86efac" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="240" y="437" text-anchor="middle" font-size="12.5" font-weight="500" fill="#14532d">Generalize Assertions</text>
  <rect x="213" y="447" width="54" height="16" rx="8" fill="url(#llm-grad)"/>
  <text x="240" y="459" text-anchor="middle" font-size="9" font-weight="700" fill="white">✦ LLM</text>

  <!-- Arrow 2.1 → 2.2 -->
  <line x1="333" y1="440" x2="356" y2="440" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Box 2.2: Explore Edge Cases (LLM) -->
  <rect x="356" y="416" width="185" height="48" rx="7" fill="white" stroke="#86efac" stroke-width="1.3" filter="url(#shadow)"/>
  <text x="448" y="437" text-anchor="middle" font-size="12.5" font-weight="500" fill="#14532d">Explore Edge Cases</text>
  <rect x="421" y="447" width="54" height="16" rx="8" fill="url(#llm-grad)"/>
  <text x="448" y="459" text-anchor="middle" font-size="9" font-weight="700" fill="white">✦ LLM</text>

  <!-- Arrow 2.2 → Iter diamond -->
  <line x1="541" y1="440" x2="572" y2="440" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Iteration Limit? diamond -->
  <polygon points="606,414 644,440 606,466 568,440" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="606" y="435" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Iter.</text>
  <text x="606" y="449" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Limit?</text>

  <!-- YES → Validation Report -->
  <line x1="644" y1="440" x2="676" y2="440" stroke="#475569" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="659" y="433" font-size="10" fill="#475569">Yes</text>

  <!-- Validation Report box -->
  <rect x="676" y="416" width="140" height="48" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)"/>
  <text x="746" y="437" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">Validation</text>
  <text x="746" y="454" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">Report ℛ</text>

  <!-- NO (re-execute) → loop back to Execute
       Exit Phase 2 bottom → go RIGHT (outside Phase 3) → UP above all phases → enter Execute from top at x=552 -->
  <polyline points="606,466 606,548 1082,548 1082,22 552,22 552,182" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arr-loop)"/>
  <text x="844" y="17" text-anchor="middle" font-size="9.5" fill="#94a3b8" font-style="italic">No (re-execute)</text>

  <!-- Figure caption -->
  <text x="550" y="566" text-anchor="middle" font-size="11" fill="#94a3b8">Figure 1. Overview of PatchGuru's three-phase workflow.</text>
</svg>
